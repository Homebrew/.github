name: Sync shared configurations

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # This should be run after dependabot.yml for this repository (Monday)
    # and before dependabot.yml for synced repositories (Friday).
    # This maximises the chance of a single sync per week handling both any
    # changes and any dependabot updates.
    - cron: "0 8 * * 3" # Every Wednesday at 8 AM
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: "sync-shared-config-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  generate-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: generate-matrix
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DOTGITHUB_WORKFLOW_TOKEN || github.token }}
          SKIP_PRIVATE: ${{ github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.fork) }}
        run: |
          repo_list_args=(
            --limit 1000
            --no-archived
            --source
          )
          if [[ "${SKIP_PRIVATE}" == true ]]
          then
            repo_list_args+=(--visibility public)
          fi
          gh repo list Homebrew "${repo_list_args[@]}" \
            --json nameWithOwner |
            jq -r '"matrix=\(map(.nameWithOwner) | tojson)"' >> "${GITHUB_OUTPUT}"
  style:
    if: github.repository == 'Homebrew/.github'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          stable: false

      - name: Set up Homebrew portable Ruby
        uses: Homebrew/actions/setup-ruby@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          portable-ruby: true

      - name: Clone source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: brew install-bundler-gems --groups=style
        env:
          HOMEBREW_DEVELOPER: 1

      - run: brew style .github/actions/sync/*.rb .github/scripts/check-licenses.sh
        env:
          HOMEBREW_DEVELOPER: 1

      - name: Test shared configuration
        run: bash .github/actions/sync/test-shared-config.sh "$(brew --repository)"

      - name: Test sync pull request reconciliation
        run: bash .github/actions/sync/test-sync-pull-request.sh

      - name: Test template workflows
        run: bash .github/actions/sync/test-template-workflows.sh

      - name: Test license workflow
        run: bash .github/actions/sync/test-license-workflow.sh

  sync:
    if: github.repository == 'Homebrew/.github'
    needs: [generate-matrix, style]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{fromJson(needs.generate-matrix.outputs.matrix)}}
      fail-fast: false
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          stable: false

      - name: Set up Homebrew portable Ruby
        uses: Homebrew/actions/setup-ruby@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          portable-ruby: true

      - name: Clone source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone brew.sh source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Homebrew/brew.sh
          path: source/brew.sh
          persist-credentials: false
          sparse-checkout: |
            _includes
            _layouts
            bin
            script

      - name: Clone private docs source repository
        if: >-
          matrix.repo == 'Homebrew/brew' &&
          (github.event_name != 'pull_request' ||
           (github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Homebrew/private
          path: source/private
          token: ${{ secrets.HOMEBREW_DOTGITHUB_WORKFLOW_TOKEN || github.token }}
          persist-credentials: false
          sparse-checkout: docs

      - name: Clone target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          path: target/${{ matrix.repo }}
          token: ${{ secrets.HOMEBREW_DOTGITHUB_WORKFLOW_TOKEN || github.token }}
          # Intentioanlly persisted to allow `git push` below.
          persist-credentials: true

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          username: BrewTestBot

      - name: Set up SSH commit signing
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        uses: Homebrew/actions/setup-commit-signing@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          signing_key: ${{ secrets.BREWTESTBOT_SSH_SIGNING_KEY }}

      - name: Sync initial Ruby version
        run: cp /home/linuxbrew/.linuxbrew/Homebrew/Library/Homebrew/.ruby-version .

      - name: Detect changes
        id: detect_changes
        env:
          TARGET: target/${{ matrix.repo }}
        run: |
          private_args=()
          if [[ -d source/private ]]
          then
            private_args+=(source/private)
          fi
          ./.github/actions/sync/shared-config.rb "${TARGET}" '/home/linuxbrew/.linuxbrew/Homebrew' source/brew.sh "${private_args[@]}"

      - name: Reconcile pull request
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cd "target/$GH_REPO"
          git checkout -b sync-shared-config

          # Stagger network calls to minimise errors.
          sleep "$(( JOB_INDEX * 5 ))"
          if gh api \
              -X GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GH_REPO}/pulls" \
              -f head=Homebrew:sync-shared-config \
              -f state=open |
              jq --exit-status 'length == 0'
          then
            if [[ "$HAS_CHANGES" != true ]]
            then
              exit 0
            fi
            git push --set-upstream --force origin sync-shared-config
            # We don't want backticks to be expanded.
            # shellcheck disable=SC2016
            gh pr create --head sync-shared-config --title "Synchronize shared configuration" --body 'This pull request was created automatically by the [`sync-shared-config`](https://github.com/Homebrew/.github/blob/HEAD/.github/actions/sync/shared-config.rb) workflow.'
          elif [[ "$HAS_CHANGES" != true ]]
          then
            gh pr close sync-shared-config --delete-branch
          else
            git fetch origin sync-shared-config
            if ! git diff --no-ext-diff --quiet --exit-code origin/sync-shared-config
            then
              git push --force origin sync-shared-config
            fi
          fi
        env:
          GH_REPO: ${{ matrix.repo }}
          GH_TOKEN: ${{ secrets.HOMEBREW_DOTGITHUB_WORKFLOW_TOKEN }}
          JOB_INDEX: ${{ strategy.job-index }}
          HAS_CHANGES: ${{ steps.detect_changes.outputs.pull_request }}
  conclusion:
    needs: sync
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Result
        env:
          RESULT: ${{ needs.sync.result }}
        run: |
          [[ "${RESULT}" == success ]]
